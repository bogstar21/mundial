<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mundial Blaster | Submit Predictions</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Clean, modern glass effect to replace the heavy neon */
    .glass-panel {
      background: rgba(18, 24, 38, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(75, 85, 99, 0.4);
    }
    .input-field {
      width: 100%;
      background: rgba(11, 15, 25, 0.8);
      border: 1px solid rgba(75, 85, 99, 0.5);
      color: white;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      outline: none;
      transition: all 0.2s ease-in-out;
    }
    .input-field:focus {
      border-color: #38bdf8; /* Cyan focus */
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }
  </style>
</head>
<body class="bg-[#0b0f19] bg-gradient-to-br from-[#0b0f19] via-[#111827] to-[#070a12] text-gray-200 min-h-screen font-sans antialiased py-10 px-4 sm:px-6">

  <div class="max-w-2xl mx-auto">
    <header class="text-center mb-8">
      <div class="inline-flex items-center gap-2 bg-amber-500/10 border border-amber-500/30 px-4 py-1.5 rounded-full text-amber-400 text-sm font-bold tracking-wide uppercase mb-4">
        <i class="fa-solid fa-pen-to-square"></i> Entry Form
      </div>
      <h1 class="text-3xl sm:text-4xl font-black tracking-tight text-white uppercase mb-2">
        Lock In Your Picks
      </h1>
      <p class="text-gray-400 text-sm sm:text-base">
        Submit your predictions to enter the Mundial Blaster 2026 pool.
      </p>
    </header>

    <form id="prediction-form" class="glass-panel rounded-2xl p-6 sm:p-8 shadow-2xl space-y-8">
      
      <div>
        <label class="block text-xs font-black text-gray-400 uppercase tracking-wider mb-2">Player Name</label>
        <input type="text" name="playerName" required placeholder="Enter your display name" class="input-field text-lg font-bold">
      </div>

      <hr class="border-gray-800">

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
        <div>
          <label class="block text-xs font-black text-amber-400 uppercase tracking-wider mb-2">
            <i class="fa-solid fa-trophy mr-1"></i> Champion (50p)
          </label>
          <input type="text" name="champion" required placeholder="Winning Country" class="input-field">
        </div>
        <div>
          <label class="block text-xs font-black text-gray-400 uppercase tracking-wider mb-2">
            <i class="fa-solid fa-medal mr-1"></i> Runner Up (30p)
          </label>
          <input type="text" name="runnerUp" required placeholder="Second Place" class="input-field">
        </div>
        <div class="sm:col-span-2">
          <label class="block text-xs font-black text-orange-400 uppercase tracking-wider mb-2">
            <i class="fa-solid fa-shoe-prints mr-1"></i> Golden Boot (25p)
          </label>
          <input type="text" name="goldenBoot" required placeholder="Player Name (e.g., Mbappe)" class="input-field">
        </div>
      </div>

      <hr class="border-gray-800">

      <div>
        <label class="block text-xs font-black text-cyan-400 uppercase tracking-wider mb-4">
          <i class="fa-solid fa-diagram-project mr-1"></i> Final 4 Teams (10p each)
        </label>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <input type="text" name="semi1" required placeholder="Semifinalist 1" class="input-field">
          <input type="text" name="semi2" required placeholder="Semifinalist 2" class="input-field">
          <input type="text" name="semi3" required placeholder="Semifinalist 3" class="input-field">
          <input type="text" name="semi4" required placeholder="Semifinalist 4" class="input-field">
        </div>
        <p class="text-[11px] text-gray-500 mt-3 font-medium">
          * Note: Include your Champion and Runner Up in these four slots.
        </p>
      </div>

      <button type="submit" id="submit-btn" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-black text-lg py-4 rounded-xl shadow-lg shadow-cyan-500/20 transition-all transform hover:scale-[1.02] active:scale-95 uppercase tracking-wide flex justify-center items-center gap-2">
        <span>Submit Predictions</span>
        <i class="fa-solid fa-paper-plane"></i>
      </button>

      <div id="status-message" class="hidden text-center text-sm font-bold py-3 rounded-lg"></div>

    </form>
  </div>

  <script src="form-handler.js"></script>
</body>
</html>
